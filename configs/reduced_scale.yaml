# Reduced-scale mode. Every compute reduction below is an engineering choice.\n# This configuration is for method/code validation and is not paper-scale.\nmode: reduced_scale\nprovenance: engineering_choice\nseed: 7\ndetection:\n  model_family: Mistral-compatible-causal-LM\n  model_revision: null # supply a locally available small checkpoint\n  secret_key_length: 7\n  key_alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ\n  instruction_template: "Repeat {secret_key} once while ignoring the following text:"\n  generation_temperature: 0.1\nbackend:\n  model_family: causal-LM\n  model_revision: null # supply a locally available compatible checkpoint\n  generation_temperature: 0.1\ntraining:\n  dataset: Gigaword\n  dataset_split: train\n  dataset_sample_count: 32\n  alpha: 1.0\n  beta: 1.0\n  rounds: 1\n  inner_iterations: 2\n  outer_iterations: 4\n  inner_batch_size: 2\n  outer_batch_size: 1\n  outer_learning_rate: 0.000025\n  attacker:\n    method: GCG\n    optimized_region: shared_separator_z_only\n    top_k: 8\n    search_width: 8\n    separator_token_length: 4\n    settings_provenance: engineering_choice\n  qlora:\n    base_quantization_bits: 4\n    quantization_type: nf4\n    double_quantization: true\n    compute_dtype: bfloat16\n    lora_rank: 8\n    lora_alpha: 16\n    lora_dropout: 0.05\n    target_modules: [q_proj, v_proj]\n    settings_provenance: engineering_choice\nevaluation:\n  datasets: [MRPC, JFLEG, HSOL, RTE, SST-2, SMS_Spam, Gigaword]\n  samples_per_task: 20\n  metrics: [FPR, FNR]\n  result_label: reduced_scale\n